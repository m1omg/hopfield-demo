name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - claude/hopfield-network-demo-nsmos0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
